<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

      background: var(--cp-accent);
      color: var(--cp-accent-fg);
    }

    .search-actions button:hover,
    #search-more:hover {
      border-color: var(--cp-accent-hover);
    }

    .search-result {
      padding-block: 1.5rem;
      border-top: 1px solid var(--cp-border);
    }

    .search-result h3 {
      margin-top: 0.5rem;
    }

    .search-result h3 a {
      color: var(--cp-text);
      text-decoration: none;
    }

    .search-result h3 a:hover {
      color: var(--cp-accent);
      text-decoration: underline;
    }

    .search-result .meta {
      margin: 0;
    }

    .search-excerpt {
      font-size: 0.9375rem;
    }

    .site-footer {
      border-top: 1px solid var(--cp-border);
      color: var(--cp-text-soft);
      font-size: 0.8125rem;
    }

    .site-footer-inner {
      padding-block: 1.5rem;
    }

    .site-footer p {
      max-width: 820px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .site-header-inner,
      .site-footer-inner,
      main {
        width: calc(100% - 2.5rem);
      }

      .site-header-inner {
        flex-direction: column;
        gap: 0;
        padding-block: 0.75rem 1rem;
      }

      .site-description {
        font-size: 0.8125rem;
      }

      main {
        padding-block: 2rem 3rem;
      }

      .hero {
        padding-top: 0;
      }

      .section-nav,
      .section-nav ul,
      .section-nav ol {
        column-gap: 1.25rem;
      }

      main > section:not(.hero) {
        margin-top: 2.5rem;
      }

      .article-item {
        padding-block: 1.5rem;
      }

      .item-heading h3 {
        flex-basis: 12rem;
      }

      .notice {
        padding: 0.75rem 1rem;
      }

      .search-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .search-controls label:has(#search-section) {
        grid-column: 1 / -1;
      }

      .github-table,
      .github-table tbody,
      .github-table td {
        display: block;
        width: 100%;
      }

      .github-table thead {
        display: none;
      }

      .github-table .repo-overview-row {
        display: grid;
        grid-template-columns: 2rem minmax(0, 1fr) auto;
        gap: 0.5rem;
        padding-block: 0.875rem;
        border-bottom: 1px solid var(--cp-border);
      }

      .github-table td {
        padding: 0;
        border: 0;
      }

      .github-table .repo-rank {
        grid-column: 1;
        grid-row: 1;
      }

      .github-table .repo-name {
        grid-column: 2;
        grid-row: 1;
      }

      .github-table .repo-stars {
        grid-column: 3;
        grid-row: 1;
        font-size: 0.75rem;
        text-align: right;
      }

      .github-table .repo-stars::after {
        content: " / week";
        display: block;
        color: var(--cp-text-soft);
        font-size: 0.625rem;
      }

      .github-table .repo-description {
        grid-column: 2 / -1;
        grid-row: 2;
        color: var(--cp-text-soft);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      html {
        scroll-behavior: smooth;
      }

      a,
      summary {
        transition: color 120ms ease;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      a,
      summary {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="@@BASE@@index.html" aria-label="Daily Tech Brief 홈">Daily Tech Brief</a>
      <p class="site-description">공개 자료로 읽는 개발·AI·클라우드 동향</p>
    </div>
  </header>
  <main id="main" tabindex="-1">@@CONTENT@@</main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>공개 자료를 바탕으로 작성하며, 모든 항목에 원문 출처를 제공합니다.</p>
    </div>
  </footer>
  <script>
    (() => {
      const revealItem = () => {
        const id = window.location.hash.slice(1);
        if (!id.startsWith("item-")) return;
        const target = document.getElementById(id);
        if (!target) return;
        for (let node = target.parentElement; node; node = node.parentElement) {
          if (node.tagName === "DETAILS") node.open = true;
        }
        target.scrollIntoView();
      };
      window.addEventListener("hashchange", revealItem);
      revealItem();
    })();
  </script>
</body>
</html>
