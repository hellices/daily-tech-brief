name: Deploy approved briefings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/brief-atlas/package-lock.json
      - name: Install pinned graph renderer
        run: npm ci --prefix tools/brief-atlas --ignore-scripts --no-audit --no-fund
      - name: Validate briefing behavior
        run: python3 -m unittest discover -s tests -q
      - name: Validate archive filters
        run: node --test tests/*.test.cjs
      - name: Validate static graph pipeline
        run: |
          python3 -m unittest discover -s tools/brief-atlas -p 'test_*.py' -q
          node --test tools/brief-atlas/analytics.test.cjs tools/brief-atlas/graph-views.test.cjs
      - name: Build approved reports only
        run: python3 briefing.py build
      - name: Build graph exploration from approved reports
        run: python3 tools/brief-atlas/build.py --reports reports --taxonomy tags.json --output site/insights --revision "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
