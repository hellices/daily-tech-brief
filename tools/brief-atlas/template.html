<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>@@SITE_THEME@@</script>
  <title>탐색 · Daily Tech Brief</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
  <style>@@SITE_STYLE@@
@@STYLE@@</style>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
@@SITE_HEADER@@
  <main id="main" class="atlas-main" tabindex="-1">
    <h1 class="sr-only">최근 글 묶음</h1>
    <div class="toolbar">
      <label><span class="sr-only">오늘 기준 기간</span><select id="span"><option value="3">최근 3일</option><option value="7" selected>최근 7일</option><option value="30">최근 30일</option></select></label>
      <label><span class="sr-only">영역</span><select id="tag"><option value="">전체 영역</option></select></label>
      <label><span class="sr-only">정렬</span><select id="ordering" title="서로 다른 글 2건·등장일 2일 이상인 묶음의 비중 증가순"><option value="rising">최근 증가</option><option value="count">최근 글 수</option></select></label>
      <button type="button" id="reset" class="text-button">초기화</button>
      <span class="today-label">오늘 기준 · 한국시간</span>
    </div>
    <nav id="section-tabs" class="section-tabs" aria-label="섹션"></nav>
    <div class="periodline"><span id="period-label"></span><span id="data-through"></span><span id="sample-label"></span></div>
    <div id="fatal" class="error" role="alert" hidden></div>
    <div class="workspace">
      <div class="visuals">
        <section class="matrix-panel" aria-label="최근 글 묶음의 변화">
          <div class="panel-head">
            <h2>최근 글 묶음 <span id="comparison-label" class="unit"></span></h2>
            <div class="segmented"><button type="button" data-unit="week" aria-pressed="true">주</button><button type="button" data-unit="month" aria-pressed="false">월</button></div>
          </div>
          <div class="heatmap-scroll"><table id="heatmap" aria-label="글 묶음별 최근 건수와 비중 변화"></table></div>
        </section>
        <section class="node-panel" aria-label="글 묶음 목록">
          <div class="node-search"><input id="group-search" type="search" placeholder="글 묶음 검색" aria-label="글 묶음 검색"><span id="group-count"></span></div>
          <div id="group-list" class="node-list"></div>
          <button type="button" id="more-groups" class="more-button" hidden>더 보기</button>
        </section>
      </div>
      <aside id="detail-panel" class="detail-panel" tabindex="-1" aria-label="관련 글">
        <div class="detail-head"><span id="evidence-period"></span><button type="button" id="inventory" class="text-button">전체 소식</button></div>
        <h2 id="detail-title"></h2>
        <div id="group-terms" class="group-terms" aria-label="공통 표현"></div>
        <button type="button" id="group-history" class="text-button" hidden>연결 글 전체</button>
        <div class="source-search"><input id="evidence-search" type="search" placeholder="소식 검색" aria-label="소식 검색"><span id="evidence-count" aria-live="polite"></span></div>
        <div id="evidence-list" class="evidence-list"></div>
        <button type="button" id="more-evidence" class="more-button" hidden>더 보기</button>
      </aside>
    </div>
    <noscript>@@STATIC@@</noscript>
  </main>
  <script id="snapshot" type="application/json">@@DATA@@</script>
  <script>@@ANALYTICS@@</script>
  <script>@@READER@@</script>
  <script>@@UI@@</script>
</body>
</html>
